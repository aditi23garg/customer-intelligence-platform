name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pandera scikit-learn xgboost fastapi pydantic pytest

      - name: Run unit tests
        run: |
          pytest tests/test_features.py tests/test_schemas.py -v

      - name: Run data validation on sample
        run: |
          python src/data_pipeline/validate.py